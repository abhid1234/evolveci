name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - run: npm --version
      - run: npm ci
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm run release:check
      - name: Build release assurance assets
        id: assets
        run: |
          pack_result=$(npm pack --ignore-scripts --json)
          tarball=$(node -e "process.stdout.write(JSON.parse(process.argv[1])[0].filename)" "$pack_result")
          test -n "$tarball"
          test -f "$tarball"
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          test -s sbom.cdx.json
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Read package metadata
        id: package
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          dist_tag=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          printf 'name=%s\nversion=%s\ntag=%s\n' "$package_name" "$package_version" "$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Check for an existing publication
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.package.outputs.tag }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"
      - name: Verify registry readback
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: test "$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --prefer-online)" = "$PACKAGE_VERSION"
      - name: Attach package and SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$TARBALL#npm package tarball" \
            "sbom.cdx.json#CycloneDX SBOM" \
            --clobber
